name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Разрешения нужны шагам deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Не гоняем два деплоя одновременно, но текущий не отменяем
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Линтер, форматирование, типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

  deploy:
    name: Деплой на GitHub Pages
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # base подставляется из имени репозитория, поэтому vite.config.ts
      # не нужно править при переименовании или форке
      - name: Сборка
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - id: deployment
        uses: actions/deploy-pages@v4
